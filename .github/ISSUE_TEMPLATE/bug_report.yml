name: Bug report
description: 报告可重现的问题，不包含密钥或个人数据。
body:
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Node.js 版本、项目提交号。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与预期行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 实际结果与脱敏日志
